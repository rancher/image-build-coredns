on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read
  security-events: write # upload Sarif results

name: Build
jobs:
  build-amd64:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set the TAG value
      id: get-TAG
      run: |
        echo "$(make -s log | grep TAG)" >> "$GITHUB_ENV"
    - name: Build container image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: .
        push: false
        tags: rancher/hardened-coredns:${{ env.TAG }}-amd64
        file: Dockerfile
        build-args: |
          TAG=${{ env.TAG }}

    - name: Download VEX metadata
      shell: bash
      run: |
        set -euo pipefail

        curl \
          --fail \
          --retry 3 \
          --retry-all-errors \
          --output "$GITHUB_WORKSPACE/.rancher.openvex.json.meta" \
          https://raw.githubusercontent.com/rancher/vexhub/refs/heads/main/reports/rancher.openvex.json

    - name: Restore Rancher VEX report
      id: vex-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/rancher.openvex.json
        key: rancher-vex-v1-${{ hashFiles('.rancher.openvex.json.meta') }}

    - name: Enable VEX report when available
      shell: bash
      run: |
        vex_file="$RUNNER_TEMP/rancher.openvex.json"

        if [[ -s "$vex_file" ]]; then
          echo "Using cached Rancher VEX report"
          echo "TRIVY_VEX=$vex_file" >> "$GITHUB_ENV"
          echo "TRIVY_SHOW_SUPPRESSED=true" >> "$GITHUB_ENV"
        else
          echo "::warning::Rancher VEX cache is unavailable; scanning without VEX"
        fi

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: rancher/hardened-coredns:${{ env.TAG }}-amd64
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'
        format: 'sarif'
        output: 'trivy-results.sarif'
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Check out code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Build container image
      run: make image-build

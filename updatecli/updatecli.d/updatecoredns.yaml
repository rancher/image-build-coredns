---
name: "Update coredns version" 

sources:
 coredns:
   name: Get coredns version
   kind: githubrelease
   spec:
     owner: coredns
     repository: coredns
     token: '{{ requiredEnv .github.token }}'
     typefilter:
       release: true
       draft: false
       prerelease: false
     versionfilter:
       kind: semver
       # Avoid obsolete/incorrect releases (e.g. `v011`, etc.)
       pattern: '~1'

targets:
  tagfile:
    name: "Bump to latest coredns version in TAG"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: TAG
      matchpattern: '(?m)^(.+)$'
      replacepattern: '{{ source "coredns" }}'

  readme:
    name: "Bump to latest coredns version in README"
    kind: file
    scmid: default
    disablesourceinput: true
    spec:
      file: README.md
      matchpattern: '(?m)^TAG=(.*)'
      replacepattern: 'TAG={{ source "coredns" }} make'

scms:
  default:
    kind: github
    spec:
      token: '{{ requiredEnv .github.token }}'
      username: '{{ requiredEnv .github.username }}'
      user: '{{ .github.user }}'
      email: '{{ .github.email }}'
      owner: '{{ .github.owner }}'
      repository: '{{ .github.repository }}'
      branch: '{{ .github.branch }}'
      
actions:
  default:
    title: 'Bump coredns version to {{ source "coredns" }}'
    kind: github/pullrequest
    spec:
      merge:
        strategy: auto
      labels:
        - updatecli
    scmid: default

